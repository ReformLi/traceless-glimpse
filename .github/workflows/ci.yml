name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotlin-build:
    name: kotlin-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build shared + jvmTest
        run: ./gradlew :shared:build :shared:jvmTest --no-daemon

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: pip install -r requirements-lock.txt
      - name: Run pytest
        run: python -m pytest -v

  schema-check:
    name: schema-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: pip install -r engine/requirements-lock.txt
      - name: Export schemas (Kotlin side)
        run: ./gradlew :shared:exportSchemas --no-daemon
      - name: Export schemas (Python side)
        run: python engine/export_schema.py
      - name: Check schema consistency
        run: python scripts/check_schema.py
